  <!-- Google Maps JS API — DirectionsService is part of core, no extra library needed -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAJGUYUdhVOmp1DoDe640xRLCE7JjFZdMw&amp;libraries=places"></script>

  <script>
    // Dart calls window.routewise_getDirections(lat1, lng1, lat2, lng2).
    // Returns a Promise that resolves to a JSON string so Dart receives a plain
    // string — no JS object crossing the boundary.
    //   success -> { "success":true, "points":[[lat,lng],...], "distanceMeters":N, "durationSeconds":N }
    //   failure -> { "success":false, "status":"STATUS_STRING" }
    // Bridge: Places Autocomplete — returns a Promise resolving to a JSON string array of predictions.
    // [{ placeId: string, description: string }, ...]
    window.routewise_autocomplete = function(input) {
      return new Promise(function(resolve) {
        var svc = new google.maps.places.AutocompleteService();
        svc.getPlacePredictions(
          { input: input, types: ['geocode'] },
          function(predictions, status) {
            if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) {
              resolve(JSON.stringify([]));
              return;
            }
            var results = predictions.map(function(p) {
              return { placeId: p.place_id, description: p.description };
            });
            resolve(JSON.stringify(results));
          }
        );
      });
    };

    // Bridge: Place Details — returns a Promise resolving to a JSON string.
    // { name, lat, lng } or null on failure.
    window.routewise_placeDetails = function(placeId) {
      return new Promise(function(resolve) {
        var dummy = document.createElement('div');
        var svc = new google.maps.places.PlacesService(dummy);
        svc.getDetails(
          { placeId: placeId, fields: ['name', 'formatted_address', 'geometry'] },
          function(place, status) {
            if (status !== google.maps.places.PlacesServiceStatus.OK || !place) {
              resolve(JSON.stringify(null));
              return;
            }
            resolve(JSON.stringify({
              name: place.formatted_address || place.name,
              lat: place.geometry.location.lat(),
              lng: place.geometry.location.lng()
            }));
          }
        );
      });
    };
    // Bridge: Reverse Geocode — returns a Promise resolving to a JSON string.
    window.routewise_reverseGeocode = function(lat, lng) {
      return new Promise(function(resolve) {
        var geocoder = new google.maps.Geocoder();
        geocoder.geocode({ location: { lat: lat, lng: lng } }, function(results, status) {
          if (status !== 'OK' || !results || results.length === 0) {
            resolve(JSON.stringify(null));
            return;
          }
          resolve(JSON.stringify({
            name: results[0].formatted_address,
            placeId: results[0].place_id
          }));
        });
      });
    };

    window.routewise_getDirections = function(originLat, originLng, destLat, destLng) {
      return new Promise(function(resolve) {
        var svc = new google.maps.DirectionsService();
        svc.route(
          {
            origin: { lat: originLat, lng: originLng },
            destination: { lat: destLat, lng: destLng },
            travelMode: google.maps.TravelMode.DRIVING
          },
          function(result, status) {
            if (status !== 'OK') {
              resolve(JSON.stringify({ success: false, status: status }));
              return;
            }
            var points = [];
            var distanceMeters = 0;
            var durationSeconds = 0;
            var legs = result.routes[0].legs;
            for (var li = 0; li < legs.length; li++) {
              distanceMeters += legs[li].distance.value;
              durationSeconds += legs[li].duration.value;
              var steps = legs[li].steps;
              for (var si = 0; si < steps.length; si++) {
                var path = steps[si].path;
                for (var pi = 0; pi < path.length; pi++) {
                  points.push([path[pi].lat(), path[pi].lng()]);
                }
              }
            }
            resolve(JSON.stringify({
              success: true,
              points: points,
              distanceMeters: distanceMeters,
              durationSeconds: durationSeconds
            }));
          }
        );
      });
    };
  </script>
